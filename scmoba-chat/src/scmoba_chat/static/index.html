<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>scMOBA-Chat | Your data</title>
<style>body{font:16px system-ui;background:#f3f7f8;color:#18333d;max-width:980px;margin:40px auto;padding:20px}section{background:white;padding:24px;margin:18px 0;border:1px solid #d5e1e4;border-radius:12px}label{display:inline-block;margin:8px}input,select,textarea,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}button{background:#267b80;color:white;border:0;border-radius:6px;cursor:pointer}textarea{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#59717a}.answer{border-left:3px solid #267b80;padding-left:15px;margin:20px 0}</style>
<h1>scMOBA-Chat</h1><p>Analyze your own transcriptomic data — on your own server.</p>
<p class="muted">Research use only. Predictions can be incorrect. No clinical diagnosis or treatment recommendations. Human scRNA-seq / snRNA-seq in this release.</p>
<section><h2>1 · Upload and prepare</h2><form id="upload"><input name="file" type="file" accept=".h5ad" required><br>
<label>Expression scale <select name="input_scale" required><option value="">Choose explicitly</option><option value="counts">Raw counts → normalize 10,000 + log1p</option><option value="log1p">Already log1p normalized (no transform)</option></select></label>
<label>Matrix <input name="layer" value="X" size="10"></label><label>Gene IDs <select name="gene_type"><option value="ensembl">Human Ensembl</option><option value="symbol">Human symbols</option></select></label><label>var column <input name="gene_column" value="index" size="12"></label><br><button>Prepare dataset</button></form><pre id="qc"></pre></section>
<section><h2>2 · Select a cell and ask</h2><select id="cells"></select> <select id="task"><option value="free">Free-text conversation</option></select> <button id="reset">New conversation</button><p id="instruction" class="muted"></p><div id="dialogue"></div>
<form id="ask"><textarea id="question" rows="3" required>Provide a detailed overview of this cell's characteristics and potential molecular context.</textarea><button>Ask scMOBA</button></form><p id="status"></p></section>
<script>
let dataset=null,session=null;const $=id=>document.getElementById(id);let busy=false;
let taskCatalog={};fetch('/tasks').then(r=>r.json()).then(x=>{taskCatalog=x;$('task').replaceChildren();Object.entries(x).forEach(([id,t])=>{let o=document.createElement('option');o.value=id;o.textContent=t.label;$('task').append(o)})});
$('task').onchange=()=>{reset();const t=taskCatalog[$('task').value];$('question').value=t.question;$('instruction').textContent=t.instruction?('Automatically prepended (Chat training wording): '+t.instruction+' Each template prediction is independent.'):'Free QA: history is retained; no task instruction is added.'};
async function result(r){const x=await r.json();if(!r.ok)throw new Error(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail));return x}
function reset(){session=null;$('dialogue').replaceChildren()}
$('reset').onclick=()=>{if(!busy)reset()};$('cells').onchange=reset;
$('upload').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('status').textContent='Preprocessing…';try{const x=await result(await fetch('/datasets',{method:'POST',body:new FormData(e.target)}));dataset=x.dataset_id;reset();$('cells').replaceChildren();x.cell_ids.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=id;$('cells').append(o)});$('qc').textContent=JSON.stringify(x.qc,null,2);$('status').textContent='Ready'}catch(err){$('status').textContent=err.message}finally{busy=false}};
$('ask').onsubmit=async e=>{e.preventDefault();if(busy)return;if(!dataset){$('status').textContent='Upload a dataset first';return}busy=true;$('cells').disabled=true;$('task').disabled=true;$('status').textContent='Generating…';try{const q=$('question').value;const task=$('task').value;const x=await result(await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset_id:dataset,cell_id:$('cells').value,question:q,task:task,session_id:task==='free'?session:null})}));session=task==='free'?x.session_id:null;const div=document.createElement('div');div.className='answer';const text=document.createElement('pre');text.textContent='You: '+q+'\n\nscMOBA: '+x.answer;div.append(text);$('dialogue').append(div);$('status').textContent=x.hit_token_limit?'Output hit token limit; may be incomplete.':'Ready'}catch(err){$('status').textContent=err.message}finally{busy=false;$('cells').disabled=false;$('task').disabled=false}};
</script></html>
