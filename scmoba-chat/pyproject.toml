[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scmoba-chat"
version = "0.1.2"
description = "Local scMOBA-Chat: user h5ad preprocessing and multimodal inference"
requires-python = ">=3.11,<3.14"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "scipy==1.16.1", "anndata==0.12.2", "datasets==4.0.0", "torch==2.8.0", "transformers==4.57.6", "peft==0.19.1", "safetensors>=0.5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scmoba-chat = "scmoba_chat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scmoba_chat = ["static/*.html"]
